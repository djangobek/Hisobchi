<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark;--bg:#04060c;--card:#0a1020;--card2:#0e1730;--line:#1a2a50;--blue:#3b82ff;--blue2:#60a5fa;--ice:#bcd4ff;--txt:#eaf1ff;--hint:#7a8bb0}
*{box-sizing:border-box}body{margin:0;padding:2px;font:13px system-ui,-apple-system,sans-serif;color:var(--txt);background:radial-gradient(120% 70% at 100% 0,#0b1a3d 0,var(--bg) 60%)}
.wrap{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#070c19,var(--bg))}
.head{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:14px;letter-spacing:1.4px;background:linear-gradient(90deg,#fff,var(--blue2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hint{font-size:10px;color:var(--hint);letter-spacing:.4px}.head>.hint:last-child{color:var(--blue2);border:1px solid var(--line);border-radius:20px;padding:3px 8px;background:#0a1330;font-weight:700}
.types{display:flex;gap:7px}.types button,.cat,.key{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--txt);font-weight:700}
.types button{flex:1;padding:10px;color:var(--hint)}.types .sel.in{background:linear-gradient(135deg,#1d4ed8,var(--blue));color:#fff;border-color:#3b82ff;box-shadow:0 4px 14px #2563ff55}.types .sel.out{background:linear-gradient(135deg,#0f1b3d,#1a2f66);color:var(--ice);border-color:#3b5bb0;box-shadow:0 4px 14px #1d3a8a44}
.amount{padding:13px 15px;border-radius:16px;background:linear-gradient(135deg,#0b1f55,#0f3a9e 70%,#1d6bff 140%);border:1px solid #2b57c2;box-shadow:0 8px 24px #1d4ed844,inset 0 1px 0 #ffffff22}.amount small{color:#b5cdf7;letter-spacing:1px;font-size:9.5px}.amount strong{display:block;font-size:28px;letter-spacing:-.6px;font-variant-numeric:tabular-nums;margin-top:3px;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.key{padding:12px 4px;font-size:17px;background:var(--card)}.key:active{background:var(--card2);border-color:var(--blue)}.key.soft{font-size:12px;color:var(--blue2)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:130px;overflow:hidden}.cat{padding:9px 4px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ice)}.cat.sel{background:linear-gradient(135deg,#1d4ed8,var(--blue));color:#fff;border-color:var(--blue2);box-shadow:0 4px 12px #2563ff55}
.note{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--hint)}.note button{border:0;background:transparent;color:var(--blue2);font-weight:700}
.save{border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,#1d4ed8,#3b82ff);color:#fff;font-weight:850;font-size:13px;letter-spacing:.3px;box-shadow:0 8px 22px #2563ff66}.save:disabled{opacity:.35;box-shadow:none}
.status{min-height:14px;text-align:center;font-size:10px;color:var(--hint)}
</style></head><body><main class="wrap">
<div class="head"><div><div class="brand">HISOBCHI <span class="hint">/ QUICK ENTRY</span></div><div class="hint">Tezkor tranzaksiya</div></div><div class="hint">🔒 SHAXSIY</div></div>
<div class="types"><button id="inc" class="sel in">↗ Daromad</button><button id="exp">↘ Xarajat</button></div>
<div class="amount"><small>SUMMA · UZS</small><strong id="amount">0</strong></div>
<div class="grid" id="keys"><button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key soft">C</button><button class="key">0</button><button class="key soft">⌫</button></div>
<div><div class="hint" style="margin-bottom:6px">KATEGORIYA</div><div class="cats" id="cats"></div></div>
<div class="note"><span id="noteLabel">Izoh qo‘shilmagan</span><button id="noteBtn">+ Izoh</button></div>
<button class="save" id="save" disabled>Tranzaksiyani saqlash →</button><div class="status" id="status">Summani kiriting va kategoriyani tanlang</div>
</main><script>
(()=>{const C=__CATEGORIES__;let type='I',amount='',cat='',note='';const newNonce=()=>Array.from(crypto.getRandomValues(new Uint8Array(6))).map(x=>x.toString(16).padStart(2,'0')).join('');let nonce=sessionStorage.getItem('hisobchi_tx_nonce')||newNonce();sessionStorage.setItem('hisobchi_tx_nonce',nonce);const $=x=>document.getElementById(x);const money=n=>new Intl.NumberFormat('uz-UZ',{maximumFractionDigits:0}).format(Number(n||0));const clean=s=>String(s).replace(/[<>&"]/g,'');function render(){ $('amount').textContent=money(amount||0);$('inc').className=type==='I'?'sel in':'';$('exp').className=type==='E'?'sel out':'';$('cats').innerHTML=C.filter(c=>c.t===type).map(c=>`<button class="cat ${cat===c.id?'sel':''}" data-id="${c.id}">${clean(c.n)}</button>`).join('');$('save').disabled=!(Number(amount)>0&&cat);$('noteLabel').textContent=note?('Izoh: '+note):'Izoh qo‘shilmagan';$('status').textContent=cat?'Saqlashga tayyor':'Summani kiriting va kategoriyani tanlang';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{cat=b.dataset.id;render();});}
async function request(action){if(!window.TelegramWidget){$('status').textContent='Widget faqat Telegram ichida ishlaydi';return;}$('save').disabled=true;$('status').textContent='Yuborilmoqda…';try{const a=await TelegramWidget.request(action);if(a?.result){const r=JSON.parse(a.result);if(r.ok){$('status').textContent=r.message||'Bajarildi';if(r.state){amount=r.state.a||'';type=r.state.t||'I';cat=r.state.c||'';note=r.state.n||'';render();}if(r.saved){amount='';cat='';note='';nonce=newNonce();sessionStorage.setItem('hisobchi_tx_nonce',nonce);render();$('status').textContent='✓ Tranzaksiya saqlandi';}}else $('status').textContent=r.message||'Xatolik yuz berdi';}}catch(e){$('status').textContent=e.code==='RATE_LIMITED'?'Juda tez bosdingiz.':e.code==='TIMEOUT'?'Server javobi kechikdi.':'So‘rov bajarilmadi.';}render();}
$('inc').onclick=()=>{type='I';cat='';render();};$('exp').onclick=()=>{type='E';cat='';render();};document.querySelectorAll('#keys button').forEach(b=>b.onclick=()=>{const k=b.textContent;if(k==='C')amount='';else if(k==='⌫')amount=amount.slice(0,-1);else if(amount.length<12)amount+=k;render();});$('noteBtn').onclick=()=>{if(!(Number(amount)>0&&cat)){$('status').textContent='Avval summa va kategoriyani tanlang';return;}const a=`note:${type}:${amount}:${cat}:${nonce}`;request(a);};$('save').onclick=()=>request(`save:${type}:${amount}:${cat}:${nonce}`);if(window.TelegramWidget){TelegramWidget.onEvent('chatDataChanged',()=>{try{const s=JSON.parse(TelegramWidget.chatData||'{}');type=s.t??type;amount=s.a??'';cat=s.c??'';note=s.n??'';render();}catch{}});TelegramWidget.ready();}render();})();
</script></body></html>
